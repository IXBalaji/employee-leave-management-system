name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, generate Prisma client, build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      # ubuntu-latest is Debian-based (glibc), matching Azure App Service
      # Linux, so the Prisma engine binary generated above is compatible
      # with the deploy target as-is.

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Package for deploy (pre-built, so Azure skips its own build)
        working-directory: backend
        run: zip -r ../backend-deploy.zip package.json package-lock.json dist prisma node_modules

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-deploy.zip
